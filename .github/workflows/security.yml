name: Security Scanning

on:
  push:
    branches:
      - "master"
  pull_request:
  schedule:
    # Weekly on Monday 06:00 UTC, independent of new commits/PRs,
    # to catch newly published CVEs against unchanged dependencies.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  osv-scanner:
    name: OSV Dependency Scan
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0
    with:
      scan-args: |-
        --recursive
        ./
      # Reports everything (incl. LOW/MEDIUM in build-only devDependencies) to
      # the Security > Code Scanning tab for triage, but does not fail the
      # build on its own. Trivy below is the hard CI gate, restricted to
      # CRITICAL/HIGH in dependencies that actually ship, so a known,
      # low-priority finding in e.g. eslint/vite tooling can't block every
      # push indefinitely. Track and clear findings via the quarterly review
      # in docs/internal/risikoakzeptanz-restrisiken.md.
      fail-on-vuln: false

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "1"

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: true
          upload-release-assets: true
